<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadLater</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .6rem; }
  button { padding: .6rem .9rem; }
  li { display: flex; justify-content: space-between; align-items: center; padding: .6rem 0; }
  li[data-read="true"] span { text-decoration: line-through; color: #667; }
  [data-testid="message"] { min-height: 1.5rem; color: #9b2c2c; }
</style>
<body>
  <h1>ReadLater</h1>
  <form data-testid="save-form">
    <input data-testid="article-title" aria-label="Article title" placeholder="Article title">
    <button data-testid="save-article" type="submit">Save</button>
  </form>
  <p data-testid="message" role="status"></p>
  <h2>Reading queue</h2>
  <ul data-testid="reading-queue"></ul>
  <script src="app.js"></script>
</body>
</html>
